general:
  experiment_name: baseline
  seed: 0

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv

target:
  column: Survived

features:
  numerical:
    - Age
    - SibSp
    - Parch
    - Fare
  categorical:
    - Pclass
    - Sex
    - Embarked

validation:
  n_splits: 5
  shuffle: true

evaluation:
  primary_metric: accuracy
  metrics:
    - accuracy
    - precision
    - recall
    - roc_auc

explainability:
  enabled: true
  sample_size: 800

models:
  logistic_regression:
    enabled: true
    params:
      C: 1.0
      max_iter: 1000

  knn:
    enabled: true
    params:
      n_neighbors: 5

  svm:
    enabled: true
    params:
      C: 1.0
      kernel: rbf

  random_forest:
    enabled: true
    params:
      random_state: ${general.seed}

  xgboost:
    enabled: true
    params:
      random_state: ${general.seed}
      n_jobs: 1

  catboost:
    enabled: true
    params:
      iterations: 500
      learning_rate: 0.03
      depth: 6
      loss_function: Logloss
      verbose: false
      random_seed: ${general.seed}

output:
  experiments_dir: outputs/experiments
  submission_dir: outputs/submissions
